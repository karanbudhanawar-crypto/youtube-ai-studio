<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='stylesheet' href='/static/style.css'><title>Analyze YouTube reference</title></head><body><main class='shell'><header><small>CONTENT RESEARCH AGENT</small><h1>Analyze a YouTube reference</h1></header><nav><a href='/'>Create video</a><a class='active' href='/analyze'>Analyze reference</a></nav><section class='card'><form method='post'><label>Video title</label><input name='title' value='{{title}}' placeholder='I Tried 10 AI Tools So You Don’t Have To'><label>Transcript or notes</label><textarea name='transcript' rows='8' placeholder='Paste captions or transcript'>{{transcript}}</textarea><button>Analyze reference</button></form>{% if analysis %}<h2>Analysis</h2><pre>{{analysis}}</pre>{% endif %}<p class='muted'>Analysis is based on information you provide; it does not automatically fetch YouTube captions.</p></section></main></body></html>
